<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPZ / VPZ Player</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f0f12; --panel:#18181d; --panel-2:#202028; --panel-3:#26262f;
  --accent:#7c5cff; --accent-2:#4ade80; --accent-3:#38bdf8;
  --danger:#ff5c5c; --warn:#ffb84d;
  --text:#eaeaf0; --dim:#8a8a97; --border:#2a2a33;
}
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; overflow: hidden;
}
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 18px; background: var(--panel);
  border-bottom: 1px solid var(--border); gap: 12px;
  flex-wrap: wrap; flex-shrink: 0;
}
.topbar h1 { font-size: 16px; font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 500; display: inline-flex; align-items: center;
  gap: 6px; white-space: nowrap; font-family: inherit;
  transition: opacity .15s, transform .1s;
}
.btn:hover { opacity: .88; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-success { background: var(--accent-2); color: #06210f; }
.btn-info    { background: var(--accent-3); color: #06222e; }
.btn-ghost   { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
.btn-sm      { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

.layout {
  display: grid; grid-template-columns: 260px 1fr 320px;
  flex: 1; overflow: hidden; min-height: 0;
}
.col-left {
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.col-left .section {
  display: flex; flex-direction: column;
  overflow: hidden; flex: 1; min-height: 0;
}
.section-title {
  font-size: 11px; color: var(--dim); text-transform: uppercase;
  letter-spacing: .08em; padding: 12px 14px 6px;
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.section-title .badge {
  background: var(--accent); color: #fff; border-radius: 10px;
  padding: 1px 7px; font-size: 10px; font-weight: 600;
}
.scroll-area {
  overflow-y: auto; padding: 0 8px 10px; flex: 1; min-height: 0;
}
.scroll-area::-webkit-scrollbar { width: 6px; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.empty-hint { color: var(--dim); text-align: center; margin: 12px 6px; font-size: 12px; }

.track {
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
}
.track:hover { background: var(--panel-2); }
.track.active { background: var(--accent); }
.track .t-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track .t-artist { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track.active .t-artist { color: #e6e1ff; }
.track .t-type {
  display: inline-block; font-size: 9px; padding: 1px 5px;
  border-radius: 4px; margin-left: 4px; vertical-align: middle;
  background: var(--panel-3); color: var(--dim);
}
.track.active .t-type { background: rgba(255,255,255,.2); color: #fff; }

.col-center {
  overflow-y: auto; padding: 22px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  min-height: 0;
}
.col-center::-webkit-scrollbar { width: 8px; }
.col-center::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.stage {
  width: 100%; max-width: 720px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.media-wrap {
  width: 100%; max-width: 720px; border-radius: 18px;
  overflow: hidden; background: var(--panel-2);
  box-shadow: 0 12px 40px rgba(0,0,0,.45); position: relative;
}
.media-wrap.audio { max-width: 320px; aspect-ratio: 1 / 1; }
.media-wrap.video { aspect-ratio: 16 / 9; background: #000; }
.media-wrap img.cover { width: 100%; height: 100%; object-fit: cover; display: block; }
.media-wrap video { width: 100%; height: 100%; display: block; background: #000; }
.cover-placeholder {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%; font-size: 96px; color: var(--dim);
}
.subtitle-overlay {
  position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
  max-width: 90%; background: rgba(0,0,0,.75); color: #fff;
  padding: 8px 16px; border-radius: 8px; font-size: 16px; line-height: 1.4;
  text-align: center; pointer-events: none; transition: opacity .2s; opacity: 0;
}
.subtitle-overlay.show { opacity: 1; }

.meta { text-align: center; max-width: 100%; }
.meta h2 {
  font-size: 20px; font-weight: 600; margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 460px;
}
.meta p { color: var(--dim); font-size: 13px; }
.meta .album { font-size: 12px; opacity: .8; margin-top: 2px; }

.audio-wrap, .video-controls {
  width: 100%; max-width: 720px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
}
audio { width: 100%; display: block; }

.timeline {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums;
}
.timeline input[type="range"] { flex: 1; accent-color: var(--accent); }
.timeline span { min-width: 32px; text-align: center; }

.controls-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.controls-row .btn-icon {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: var(--panel-2); color: var(--text); cursor: pointer;
  font-size: 16px; display: inline-flex; align-items: center; justify-content: center;
}
.controls-row .btn-icon:hover { background: var(--panel-3); }
.controls-row .btn-icon.play { background: var(--accent); color: #fff; }
.controls-row .btn-icon.play:hover { opacity: .88; }
.controls-row select {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.quality-row {
  display: flex; gap: 8px; align-items: center;
  font-size: 12px; color: var(--dim); flex-wrap: wrap;
}
.quality-row select {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 8px; font-size: 12px; cursor: pointer;
}

.fx-card {
  width: 100%; max-width: 720px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
}
.fx-head {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--dim);
  text-transform: uppercase; letter-spacing: .06em;
}
.fx-head .fx-reset {
  background: transparent; border: 1px solid var(--border);
  color: var(--dim); border-radius: 6px;
  padding: 3px 9px; font-size: 11px; cursor: pointer; text-transform: none;
}
.fx-head .fx-reset:hover { color: var(--text); border-color: var(--accent); }
.fx-row {
  display: grid; grid-template-columns: 120px 1fr 54px;
  gap: 10px; align-items: center; font-size: 12px;
}
.fx-row label { color: var(--dim); }
.fx-row input[type="range"] { width: 100%; accent-color: var(--accent); }
.fx-row .val {
  text-align: right; font-variant-numeric: tabular-nums;
  color: var(--accent-2); font-weight: 600; font-size: 12px;
}
.fx-row .val.warn { color: var(--warn); }
.fx-row .val.hot  { color: var(--danger); }

.col-right {
  background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.lyrics-scroll {
  overflow-y: auto; padding: 0 16px 16px; flex: 1; min-height: 0;
}
.lyrics-scroll::-webkit-scrollbar { width: 6px; }
.lyrics-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.lyrics .line {
  color: var(--dim); transition: color .18s, font-weight .18s;
  padding: 4px 0; font-size: 13px; line-height: 1.5; cursor: pointer;
}
.lyrics .line:hover { color: var(--text); }
.lyrics .line.active { color: var(--accent); font-weight: 600; }
.lyrics .dim { color: var(--dim); font-size: 12px; }

.status {
  padding: 6px 18px; background: var(--panel);
  border-top: 1px solid var(--border); font-size: 11px;
  color: var(--dim); flex-shrink: 0;
}

@media (max-width: 1100px) { .layout { grid-template-columns: 220px 1fr 260px; } }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; overflow-y: auto; }
  .col-left, .col-right { display: none; }
  .col-center { overflow: visible; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>🎵 MPZ / VPZ Player</h1>
  <div class="topbar-actions">
    <button class="btn btn-success" id="openCreatorBtn">➕ Создать пакет</button>
    <label class="btn btn-primary">
      <input type="file" id="fileInput" accept=".mpz,.vpz,.mp1m,.zip" hidden>
      📂 Открыть пакет
    </label>
  </div>
</div>

<div class="layout">

  <aside class="col-left">
    <div class="section">
      <div class="section-title">
        <span>Треки</span>
        <span class="badge" id="playlistCount" hidden>0</span>
      </div>
      <div class="scroll-area" id="playlist">
        <p class="empty-hint">Откройте .mpz / .vpz / .mp1m</p>
      </div>
    </div>
  </aside>

  <main class="col-center">
    <div class="stage">

      <div class="media-wrap audio" id="mediaWrap">
        <img id="cover" class="cover" alt="cover" hidden>
        <div id="coverPlaceholder" class="cover-placeholder">♪</div>
        <video id="video" hidden playsinline controls></video>
        <div class="subtitle-overlay" id="subtitleOverlay"></div>
      </div>

      <div class="meta">
        <h2 id="title">—</h2>
        <p id="artist">—</p>
        <p id="album" class="album"></p>
      </div>

      <div class="quality-row">
        <label for="qualitySelect">Качество:</label>
        <select id="qualitySelect" disabled>
          <option value="">—</option>
        </select>
      </div>

      <div class="audio-wrap" id="audioWrap">
        <audio id="audio" preload="metadata"></audio>
        <div class="controls-row">
          <button class="btn-icon play" id="audioPlayBtn" title="Play / Pause">▶</button>
          <div class="timeline" style="flex:1;">
            <span id="curTime">0:00</span>
            <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
            <span id="durTime">0:00</span>
          </div>
        </div>
      </div>

      <div class="video-controls" id="videoControls" style="display:none;">
        <div class="controls-row">
          <button class="btn-icon play" id="videoPlayBtn" title="Play / Pause">▶</button>
          <div class="timeline" style="flex:1;">
            <span id="vcurTime">0:00</span>
            <input type="range" id="vseek" min="0" max="100" value="0" step="0.1">
            <span id="vdurTime">0:00</span>
          </div>
          <button class="btn-icon" id="fullscreenBtn" title="Fullscreen">⛶</button>
        </div>
        <div class="quality-row" id="trackSelectors" style="display:none;"></div>
      </div>

      <div class="fx-card" id="fxCard">
        <div class="fx-head">
          <span>🎛 Эффекты</span>
          <button class="fx-reset" id="fxReset">Сбросить</button>
        </div>
        <div class="fx-row">
          <label for="bassRange">🔊 Бас</label>
          <input type="range" id="bassRange" min="-12" max="18" step="1" value="0">
          <span class="val" id="bassVal">0 дБ</span>
        </div>
        <div class="fx-row">
          <label for="speedRange">⏩ Скорость</label>
          <input type="range" id="speedRange" min="0.5" max="2" step="0.05" value="1">
          <span class="val" id="speedVal">1.00×</span>
        </div>
      </div>

    </div>
  </main>

  <aside class="col-right">
    <div class="section-title"><span id="rightTitle">Текст / Субтитры</span></div>
    <div class="lyrics-scroll">
      <div class="lyrics" id="lyrics">
        <p class="dim">Не загружено.</p>
      </div>
    </div>
  </aside>

</div>

<div class="status" id="status">Готов к работе</div>

<script>
/* =========================================================
   MPZ / VPZ Player — финальная версия
   ========================================================= */

const state = {
  zip: null,
  tracks: [],
  current: null,
  currentIdx: -1,
  objectUrls: [],
  audioCtx: null,
  sourceNode: null,
  bassNode: null,
  graphReady: false,
  activeSoundpackBlobUrl: null,
  syncAudioEl: null,
};

const $ = (id) => document.getElementById(id);
const fileInput      = $("fileInput");
const playlistEl     = $("playlist");
const playlistCount  = $("playlistCount");
const coverEl        = $("cover");
const coverPh        = $("coverPlaceholder");
const videoEl        = $("video");
const mediaWrap      = $("mediaWrap");
const subtitleOv     = $("subtitleOverlay");
const titleEl        = $("title");
const artistEl       = $("artist");
const albumEl        = $("album");
const qualitySel     = $("qualitySelect");
const audioWrap      = $("audioWrap");
const videoControls  = $("videoControls");
const audioEl        = $("audio");
const audioPlayBtn   = $("audioPlayBtn");
const seekEl         = $("seek");
const curTimeEl      = $("curTime");
const durTimeEl      = $("durTime");
const videoPlayBtn   = $("videoPlayBtn");
const vseekEl        = $("vseek");
const vcurTimeEl     = $("vcurTime");
const vdurTimeEl     = $("vdurTime");
const fullscreenBtn  = $("fullscreenBtn");
const trackSelectors = $("trackSelectors");
const lyricsEl       = $("lyrics");
const rightTitle     = $("rightTitle");
const statusEl       = $("status");
const bassRange      = $("bassRange");
const bassVal        = $("bassVal");
const speedRange     = $("speedRange");
const speedVal       = $("speedVal");
const fxReset        = $("fxReset");
const fxCard         = $("fxCard");

/* ---------------- Утилиты ---------------- */
function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}
function setStatus(t){ statusEl.textContent = t; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function resetObjectUrls(){
  state.objectUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch(e){} });
  state.objectUrls = [];
}

/* ---------------- Web Audio (для аудио) ---------------- */
function initAudioGraph(){
  if (state.graphReady) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    state.audioCtx = new Ctx();
    state.sourceNode = state.audioCtx.createMediaElementSource(audioEl);
    state.bassNode = state.audioCtx.createBiquadFilter();
    state.bassNode.type = "lowshelf";
    state.bassNode.frequency.value = 200;
    state.bassNode.gain.value = Number(bassRange.value);
    state.sourceNode.connect(state.bassNode);
    state.bassNode.connect(state.audioCtx.destination);
    state.graphReady = true;
  } catch(e){ console.warn("Web Audio:", e); }
}
function ensureAudioRunning(){
  if (state.audioCtx && state.audioCtx.state === "suspended") {
    state.audioCtx.resume().catch(()=>{});
  }
}

/* Эффекты (только для аудио) */
bassRange.addEventListener("input", ()=>{
  const db = Number(bassRange.value);
  bassVal.textContent = `${db > 0 ? "+" : ""}${db} дБ`;
  bassVal.classList.remove("warn","hot");
  if (db >= 12) bassVal.classList.add("hot");
  else if (db >= 6) bassVal.classList.add("warn");
  if (state.bassNode) state.bassNode.gain.value = db;
});
speedRange.addEventListener("input", ()=>{
  const rate = Number(speedRange.value);
  speedVal.textContent = `${rate.toFixed(2)}×`;
  audioEl.playbackRate = rate;
  audioEl.preservesPitch = false;
  audioEl.mozPreservesPitch = false;
  audioEl.webkitPreservesPitch = false;
});
fxReset.addEventListener("click", ()=>{
  bassRange.value = 0; bassRange.dispatchEvent(new Event("input"));
  speedRange.value = 1; speedRange.dispatchEvent(new Event("input"));
  setStatus("Эффекты сброшены");
});

/* ---------------- Парсеры ---------------- */
function parseLRC(text){
  const out = [];
  text.split("\n").forEach((line)=>{
    const m = line.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
    if (m){
      const time = parseInt(m[1])*60 + parseFloat(m[2]);
      const content = m[3].trim();
      if (content) out.push({ time, content });
    }
  });
  return out;
}

function parseTTML(xmlText){
  try {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (doc.querySelector("parsererror")) return null;

    let title = null, artist = null;
    const all = doc.getElementsByTagName("*");
    for (let i = 0; i < all.length; i++){
      const el = all[i];
      const local = (el.localName || el.nodeName.split(":").pop() || "").toLowerCase();
      if (local === "title" && !title) title = el.textContent.trim();
      if (local === "name" && !artist){
        const type = el.getAttribute("type") || "";
        if (!type || type === "full") artist = el.textContent.trim();
      }
    }
    const lines = [];
    const pTags = doc.getElementsByTagName("p");
    for (let i = 0; i < pTags.length; i++){
      const p = pTags[i];
      const begin = p.getAttribute("begin");
      if (!begin) continue;
      const t = parseTTMLTime(begin);
      const c = p.textContent.replace(/\s+/g, " ").trim();
      if (c && isFinite(t)) lines.push({ time: t, content: c });
    }
    lines.sort((a,b)=>a.time - b.time);
    return { title, artist, lines };
  } catch(e){ return null; }
}
function parseTTMLTime(str){
  if (!str) return NaN;
  const parts = String(str).trim().split(":");
  let h = 0, m = 0, s = 0;
  if (parts.length === 3){ h=parseFloat(parts[0]); m=parseFloat(parts[1]); s=parseFloat(parts[2]); }
  else if (parts.length === 2){ m=parseFloat(parts[0]); s=parseFloat(parts[1]); }
  else { s=parseFloat(parts[0]); }
  return h*3600 + m*60 + s;
}
function parseSRT(text){
  const out = [];
  const blocks = text.replace(/\r/g, "").split(/\n\n+/);
  for (const block of blocks){
    const lines = block.split("\n").filter(l=>l.trim());
    if (lines.length < 2) continue;
    const timeLine = lines.find(l => l.includes("-->"));
    if (!timeLine) continue;
    const m = timeLine.match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->/);
    if (!m) continue;
    const t = parseInt(m[1])*3600 + parseInt(m[2])*60 + parseInt(m[3]) + parseInt(m[4])/1000;
    const content = lines.slice(lines.indexOf(timeLine)+1).join(" ").trim();
    if (content) out.push({ time: t, content });
  }
  return out;
}
function parseVTT(text){
  const out = [];
  const blocks = text.replace(/\r/g, "").split(/\n\n+/);
  for (const block of blocks){
    const lines = block.split("\n").filter(l=>l.trim());
    if (lines.length < 2) continue;
    const timeLine = lines.find(l => l.includes("-->"));
    if (!timeLine) continue;
    const m = timeLine.match(/(\d{1,2}):(\d{2}):(\d{2})\.(\d{3})\s*-->/);
    if (!m) continue;
    const t = parseInt(m[1])*3600 + parseInt(m[2])*60 + parseInt(m[3]) + parseInt(m[4])/1000;
    const content = lines.slice(lines.indexOf(timeLine)+1).join(" ").trim();
    if (content) out.push({ time: t, content });
  }
  return out;
}

/* =========================================================
   ЗАГРУЗКА ПАКЕТА
   ========================================================= */
fileInput.addEventListener("change", (e)=>{
  const f = e.target.files[0];
  if (f) handlePackage(f);
});

async function handlePackage(file){
  setStatus(`Чтение ${file.name}…`);
  try {
    const zip = await JSZip.loadAsync(file);
    state.zip = zip;
    resetObjectUrls();
    stopAllPlayback();

    const tracks = await collectTracks(zip);
    if (tracks.length === 0){
      setStatus("В пакете не найдено треков.");
      return;
    }
    state.tracks = tracks;
    renderPlaylist();
    selectTrack(0);
    const kindText = tracks[0].kind === "video" ? "VPZ" : "MPZ";
    setStatus(`Загружено: ${tracks.length} (${kindText})`);
  } catch(err){
    console.error(err);
    setStatus("Ошибка чтения пакета: " + err.message);
  }
}

async function loadPackageFromPath(path){
  try {
    if (!window.pywebview || !window.pywebview.api) return;
    const res = await window.pywebview.api.read_file_b64(path);
    if (!res.ok){ setStatus("⚠ " + res.error); return; }
    const binary = atob(res.data);
    const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: "application/zip" });
    const f = new File([blob], res.name, { type: "application/zip" });
    await handlePackage(f);
  } catch(e){
    console.error(e);
    setStatus("⚠ Ошибка открытия: " + e.message);
  }
}

async function collectTracks(zip){
  const rootFolders = new Set();
  zip.forEach((path)=>{
    const top = path.split("/")[0];
    if (top && !top.startsWith(".")) rootFolders.add(top);
  });

  const tracks = [];
  for (const folder of rootFolders){
    const metaFile = zip.file(`${folder}/meta-data`);
    if (!metaFile) continue;

    const metaRaw = await metaFile.async("string");
    const meta = parseMeta(metaRaw);

    const hasVideo = zip.file(new RegExp(`^${folder}/video/.*\\.(mp4|webm)$`)).length > 0;
    const hasMusic = zip.file(new RegExp(`^${folder}/(music|audio)/.*\\.(mp3|ogg|mp192)$`)).length > 0;
    const kind = hasVideo ? "video" : (hasMusic ? "audio" : null);
    if (!kind) continue;

    let coverUrl = null;
    for (const ext of ["jpg","jpeg","png","webp"]){
      const f = zip.file(`${folder}/cover/cover.${ext}`);
      if (f){
        const blob = await f.async("blob");
        coverUrl = URL.createObjectURL(blob);
        state.objectUrls.push(coverUrl);
        break;
      }
    }

    const track = {
      path: folder,
      meta,
      kind,
      coverUrl,
      audioUrls: {},
      videoUrls: {},
      soundpackUrls: {},
      lyrics: null,
      subtitles: null,
    };

    if (kind === "audio"){
      const audioMap = {
        hifi: [`${folder}/music/music.ogg`,   `${folder}/audio/music.ogg`],
        hq:   [`${folder}/music/music.mp3`,   `${folder}/audio/music.mp3`],
        mq:   [`${folder}/music/music.mp192`, `${folder}/audio/music.mp192`],
      };
      for (const [k, paths] of Object.entries(audioMap)){
        for (const p of paths){
          const f = zip.file(p);
          if (f){
            const blob = await f.async("blob");
            const url = URL.createObjectURL(blob);
            state.objectUrls.push(url);
            track.audioUrls[k] = url;
            break;
          }
        }
      }
    }

    if (kind === "video"){
      const videoMap = {
        v1080: `${folder}/video/video_1080.mp4`,
        v720:  `${folder}/video/video_720.mp4`,
        v480:  `${folder}/video/video_480.mp4`,
      };
      for (const [k, p] of Object.entries(videoMap)){
        const f = zip.file(p);
        if (f){
          const blob = await f.async("blob");
          const url = URL.createObjectURL(blob);
          state.objectUrls.push(url);
          track.videoUrls[k] = url;
        }
      }
      if (Object.keys(track.videoUrls).length === 0) continue;
    }

    // Soundpack
    const spFolder = `${folder}/soundpack`;
    const spFiles = zip.file(new RegExp(`^${spFolder}/.*\\.(mp3|ogg|wav|m4a)$`));
    for (const f of spFiles){
      const fname = f.name.split("/").pop().replace(/\.[^.]+$/, "");
      const blob = await f.async("blob");
      const url = URL.createObjectURL(blob);
      state.objectUrls.push(url);
      track.soundpackUrls[fname] = url;
    }

    // Текст/субтитры
    if (kind === "audio"){
      track.lyrics = await loadLyrics(zip, folder);
    } else {
      track.subtitles = await loadSubtitles(zip, folder);
    }

    tracks.push(track);
  }
  return tracks;
}

async function loadLyrics(zip, folder){
  const ttmlFile = zip.file(new RegExp(`^${folder}/lyrics/.*\\.ttml$`))[0];
  if (ttmlFile) return { type: "ttml", data: await ttmlFile.async("string") };

  const lrcFile = zip.file(new RegExp(`^${folder}/lyrics/.*\\.lrc$`))[0];
  if (lrcFile){
    const data = await lrcFile.async("string");
    return { type: "lrc", data, parsed: parseLRC(data) };
  }
  const txtFile = zip.file(new RegExp(`^${folder}/lyrics/.*\\.txt$`))[0];
  if (txtFile) return { type: "txt", data: await txtFile.async("string") };
  return null;
}

async function loadSubtitles(zip, folder){
  const ttmlFile = zip.file(new RegExp(`^${folder}/subtitles/.*\\.ttml$`))[0];
  if (ttmlFile){
    const data = await ttmlFile.async("string");
    const parsed = parseTTML(data);
    return { type: "ttml", data, parsed: parsed ? parsed.lines : [] };
  }
  const vttFile = zip.file(new RegExp(`^${folder}/subtitles/.*\\.vtt$`))[0];
  if (vttFile){
    const data = await vttFile.async("string");
    return { type: "vtt", data, parsed: parseVTT(data) };
  }
  const srtFile = zip.file(new RegExp(`^${folder}/subtitles/.*\\.srt$`))[0];
  if (srtFile){
    const data = await srtFile.async("string");
    return { type: "srt", data, parsed: parseSRT(data) };
  }
  return null;
}

function parseMeta(raw){
  try { return JSON.parse(raw); }
  catch {
    const obj = {};
    raw.split("\n").forEach((line)=>{
      const m = line.match(/^\s*([\w_]+)\s*[:=]\s*(.+)$/);
      if (m) obj[m[1]] = m[2].trim();
    });
    return obj;
  }
}

/* =========================================================
   ПЛЕЙЛИСТ
   ========================================================= */
function renderPlaylist(){
  playlistEl.innerHTML = "";
  playlistCount.hidden = state.tracks.length === 0;
  playlistCount.textContent = state.tracks.length;

  if (state.tracks.length === 0){
    playlistEl.innerHTML = `<p class="empty-hint">Пусто</p>`;
    return;
  }

  state.tracks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "track";
    div.dataset.index = i;
    const badge = t.kind === "video" ? "VIDEO" : "AUDIO";
    div.innerHTML = `
      <span class="t-title">${escapeHtml(t.meta.title || t.path)} <span class="t-type">${badge}</span></span>
      <span class="t-artist">${escapeHtml(t.meta.artist || "")}</span>
    `;
    div.addEventListener("click", ()=>selectTrack(i));
    playlistEl.appendChild(div);
  });
}

/* =========================================================
   ВЫБОР ТРЕКА
   ========================================================= */
function selectTrack(index){
  const track = state.tracks[index];
  if (!track) return;

  stopAllPlayback();
  state.current = track;
  state.currentIdx = index;

  console.log("[MPZ] Трек выбран:", track.meta.title, "тип:", track.kind);
  console.log("[MPZ] videoUrls:", track.videoUrls);
  console.log("[MPZ] audioUrls:", track.audioUrls);

  document.querySelectorAll(".track").forEach((el)=>{
    el.classList.toggle("active", Number(el.dataset.index) === index);
  });

  titleEl.textContent  = track.meta.title  || "—";
  artistEl.textContent = track.meta.artist || "—";
  albumEl.textContent  = track.meta.album  || "";

  if (track.kind === "video"){
    showVideoUI(track);
  } else {
    showAudioUI(track);
  }

  setStatus(`Воспроизведение: ${track.meta.title || track.path}`);
}

/* ---------------- АУДИО ---------------- */
function showAudioUI(track){
  mediaWrap.className = "media-wrap audio";

  // прячем video
  videoEl.pause();
  videoEl.removeAttribute("src");
  videoEl.hidden = true;
  videoEl.style.display = "none";

  // показываем обложку
  coverEl.style.display = "block";
  coverEl.hidden = false;
  coverPh.style.display = "flex";
  coverPh.hidden = false;

  audioWrap.style.display = "";
  videoControls.style.display = "none";
  fxCard.style.display = "";
  rightTitle.textContent = "Текст песни";

  if (track.coverUrl){
    coverEl.src = track.coverUrl;
    coverEl.hidden = false;
    coverEl.style.display = "block";
    coverPh.hidden = true;
    coverPh.style.display = "none";
  } else {
    coverEl.hidden = true;
    coverEl.style.display = "none";
    coverPh.hidden = false;
    coverPh.style.display = "flex";
  }

  // === Качество (аудио) ===
  qualitySel.innerHTML = "";
  const Q = [
    { key:"hifi", label:"Hi-Fi (440 kbps)" },
    { key:"hq",   label:"HQ (320 kbps)" },
    { key:"mq",   label:"MQ (192 kbps)" },
  ];
  Q.forEach((q)=>{
    if (track.audioUrls[q.key]){
      const opt = document.createElement("option");
      opt.value = q.key; opt.textContent = q.label;
      qualitySel.appendChild(opt);
    }
  });
  qualitySel.disabled = qualitySel.options.length <= 1;

  const best = Q.find(q => track.audioUrls[q.key]);
  if (best){
    qualitySel.value = best.key;
    audioEl.src = track.audioUrls[best.key];
    audioEl.playbackRate = Number(speedRange.value);
    audioEl.preservesPitch = false;
    audioEl.play().catch(e => console.warn("audio autoplay:", e));
  } else {
    setStatus("⚠ Аудио не найдено в пакете");
  }

  renderLyrics(track);
}

/* ---------------- ВИДЕО ---------------- */
function showVideoUI(track){
  mediaWrap.className = "media-wrap video";

  // прячем обложку
  coverEl.hidden = true;
  coverEl.style.display = "none";
  coverEl.removeAttribute("src");

  coverPh.hidden = true;
  coverPh.style.display = "none";

  // показываем video
  videoEl.hidden = false;
  videoEl.style.display = "block";
  videoEl.style.width = "100%";
  videoEl.style.height = "100%";
  videoEl.style.objectFit = "contain";
  videoEl.style.background = "#000";
  videoEl.style.zIndex = "2";

  audioWrap.style.display = "none";
  try { audioEl.pause(); audioEl.removeAttribute("src"); } catch(e){}

  videoControls.style.display = "";
  fxCard.style.display = "none";
  rightTitle.textContent = "Субтитры";

  // === Качество (видео) — ВОТ ЭТОГО НЕ ХВАТАЛО ===
  qualitySel.innerHTML = "";
  const Q = [
    { key:"v1080", label:"1080p — Full HD" },
    { key:"v720",  label:"720p — HD" },
    { key:"v480",  label:"480p — Mobile" },
  ];
  Q.forEach((q)=>{
    if (track.videoUrls[q.key]){
      const opt = document.createElement("option");
      opt.value = q.key; opt.textContent = q.label;
      qualitySel.appendChild(opt);
    }
  });
  qualitySel.disabled = qualitySel.options.length <= 1;

  const best = Q.find(q => track.videoUrls[q.key]);
  if (best){
    qualitySel.value = best.key;
    console.log("[VPZ] Ставлю видео src:", best.key, track.videoUrls[best.key]);
    videoEl.src = track.videoUrls[best.key];
    videoEl.load();
    videoEl.play()
      .then(()=> console.log("[VPZ] видео запущено"))
      .catch(e => {
        console.warn("[VPZ] autoplay не сработал:", e.message);
        setStatus("Нажми ▶ для запуска видео");
      });
  } else {
    console.warn("[VPZ] Нет доступных видео-качеств");
    setStatus("⚠ Видео не найдено в пакете");
  }

  renderSubtitles(track);
}

/* ---------------- ТЕКСТ/СУБТИТРЫ ---------------- */
function renderLyrics(track){
  lyricsEl.innerHTML = "";
  const lyrics = track.lyrics;
  if (!lyrics){
    lyricsEl.innerHTML = `<p class="dim">Текст песни отсутствует.</p>`;
    return;
  }
  if (lyrics.type === "lrc" && lyrics.parsed && lyrics.parsed.length){
    lyrics.parsed.forEach((line, i) => {
      const p = document.createElement("p");
      p.className = "line";
      p.dataset.time = line.time;
      p.textContent = line.content;
      p.onclick = ()=>{ if (audioEl.duration) audioEl.currentTime = line.time; };
      lyricsEl.appendChild(p);
    });
    return;
  }
  if (lyrics.type === "ttml"){
    const parsed = parseTTML(lyrics.data);
    if (!parsed || !parsed.lines.length){
      lyricsEl.innerHTML = `<p class="dim">TTML не содержит текста.</p>`;
      return;
    }
    parsed.lines.forEach((line)=>{
      const p = document.createElement("p");
      p.className = "line";
      p.dataset.time = line.time;
      p.textContent = line.content;
      p.onclick = ()=>{ if (audioEl.duration) audioEl.currentTime = line.time; };
      lyricsEl.appendChild(p);
    });
    track.lyrics.parsed = parsed.lines;
    return;
  }
  lyricsEl.innerHTML = `<p style="font-size:13px;line-height:1.6;white-space:pre-wrap;">${escapeHtml(lyrics.data)}</p>`;
}

function renderSubtitles(track){
  lyricsEl.innerHTML = "";
  const subs = track.subtitles;
  if (!subs || !subs.parsed || subs.parsed.length === 0){
    lyricsEl.innerHTML = `<p class="dim">Субтитры отсутствуют.</p>`;
    return;
  }
  subs.parsed.forEach((line)=>{
    const p = document.createElement("p");
    p.className = "line";
    p.dataset.time = line.time;
    p.textContent = line.content;
    p.onclick = ()=>{ if (videoEl.duration) videoEl.currentTime = line.time; };
    lyricsEl.appendChild(p);
  });
}

/* =========================================================
   СОБЫТИЯ
   ========================================================= */
/* --- Аудио --- */
audioEl.addEventListener("timeupdate", ()=>{
  const { currentTime, duration } = audioEl;
  seekEl.value = duration ? (currentTime / duration) * 100 : 0;
  curTimeEl.textContent = fmtTime(currentTime);
  durTimeEl.textContent = fmtTime(duration);

  if (!state.current || state.current.kind !== "audio") return;
  if (!state.current.lyrics || !state.current.lyrics.parsed) return;
  const lines = lyricsEl.querySelectorAll(".line");
  let activeIdx = -1;
  state.current.lyrics.parsed.forEach((line, i) => {
    if (currentTime >= line.time) activeIdx = i;
  });
  lines.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
  if (activeIdx >= 0) lines[activeIdx].scrollIntoView({ block:"center", behavior:"smooth" });
});
audioEl.addEventListener("loadedmetadata", ()=>{ durTimeEl.textContent = fmtTime(audioEl.duration); });
audioEl.addEventListener("ended", ()=> playNext());
audioEl.addEventListener("play", ()=>{
  initAudioGraph(); ensureAudioRunning();
  audioPlayBtn.textContent = "⏸";
});
audioEl.addEventListener("pause", ()=>{ audioPlayBtn.textContent = "▶"; });
audioEl.addEventListener("error", (e)=>{
  console.error("[MPZ] audio error:", audioEl.error);
});

/* --- Видео --- */
videoEl.addEventListener("timeupdate", ()=>{
  const { currentTime, duration } = videoEl;
  vseekEl.value = duration ? (currentTime / duration) * 100 : 0;
  vcurTimeEl.textContent = fmtTime(currentTime);
  vdurTimeEl.textContent = fmtTime(duration);

  if (!state.current || state.current.kind !== "video") return;
  const subs = state.current.subtitles;
  if (!subs || !subs.parsed || !subs.parsed.length) return;

  const lines = lyricsEl.querySelectorAll(".line");
  let activeIdx = -1;
  subs.parsed.forEach((line, i) => {
    if (currentTime >= line.time) activeIdx = i;
  });
  lines.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
  if (activeIdx >= 0){
    lines[activeIdx].scrollIntoView({ block:"center", behavior:"smooth" });
    subtitleOv.textContent = subs.parsed[activeIdx].content;
    subtitleOv.classList.add("show");
  } else {
    subtitleOv.classList.remove("show");
  }
});
videoEl.addEventListener("loadedmetadata", ()=>{ vdurTimeEl.textContent = fmtTime(videoEl.duration); });
videoEl.addEventListener("loadeddata", ()=>{ console.log("[VPZ] video loadeddata, играет"); setStatus("Видео загружено"); });
videoEl.addEventListener("error", ()=>{
  const err = videoEl.error;
  console.error("[VPZ] video error:", err ? err.code : "?", err ? err.message : "");
  setStatus(`⚠ Видео не играет: ${err ? err.message : "unknown"} (код ${err ? err.code : "?"})`);
});
videoEl.addEventListener("stalled", ()=>{ console.warn("[VPZ] video stalled"); });
videoEl.addEventListener("ended", ()=> playNext());
videoEl.addEventListener("play", ()=>{
  videoPlayBtn.textContent = "⏸";
  if (state.syncAudioEl && state.activeSoundpackBlobUrl) state.syncAudioEl.play().catch(()=>{});
});
videoEl.addEventListener("pause", ()=>{
  videoPlayBtn.textContent = "▶";
  if (state.syncAudioEl) state.syncAudioEl.pause();
});

/* --- Кнопки --- */
audioPlayBtn.addEventListener("click", ()=>{ if (audioEl.paused) audioEl.play(); else audioEl.pause(); });
videoPlayBtn.addEventListener("click", ()=>{ if (videoEl.paused) videoEl.play(); else videoEl.pause(); });
seekEl.addEventListener("input", ()=>{ if (audioEl.duration) audioEl.currentTime = (seekEl.value/100)*audioEl.duration; });
vseekEl.addEventListener("input", ()=>{ if (videoEl.duration) videoEl.currentTime = (vseekEl.value/100)*videoEl.duration; });
fullscreenBtn.addEventListener("click", ()=>{
  if (mediaWrap.requestFullscreen) mediaWrap.requestFullscreen();
  else if (mediaWrap.webkitRequestFullscreen) mediaWrap.webkitRequestFullscreen();
});

/* --- Смена качества --- */
qualitySel.addEventListener("change", ()=>{
  if (!state.current) return;
  const track = state.current;
  if (track.kind === "audio"){
    const url = track.audioUrls[qualitySel.value];
    if (!url) return;
    const t = audioEl.currentTime;
    const wasPlaying = !audioEl.paused;
    audioEl.src = url;
    audioEl.currentTime = t;
    audioEl.playbackRate = Number(speedRange.value);
    if (wasPlaying) audioEl.play();
  } else {
    const url = track.videoUrls[qualitySel.value];
    if (!url) return;
    const t = videoEl.currentTime;
    const wasPlaying = !videoEl.paused;
    videoEl.src = url;
    videoEl.load();
    videoEl.currentTime = t;
    if (wasPlaying) videoEl.play();
  }
});

/* =========================================================
   АВТОПЕРЕХОД
   ========================================================= */
function playNext(){
  const idx = state.tracks.indexOf(state.current);
  if (idx >= 0 && idx < state.tracks.length - 1) selectTrack(idx + 1);
}

function stopAllPlayback(){
  try { audioEl.pause(); audioEl.removeAttribute("src"); } catch(e){}
  try { videoEl.pause(); videoEl.removeAttribute("src"); } catch(e){}
  if (state.syncAudioEl){
    try { state.syncAudioEl.pause(); state.syncAudioEl.removeAttribute("src"); } catch(e){}
  }
  subtitleOv.classList.remove("show");
}

/* =========================================================
   DRAG & DROP
   ========================================================= */
document.addEventListener("dragover", (e)=> e.preventDefault());
document.addEventListener("drop", async (e)=>{
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  await handlePackage(file);
});

/* =========================================================
   pywebview
   ========================================================= */
window.addEventListener("pywebviewready", async ()=>{
  try {
    const startupPath = await window.pywebview.api.get_startup_file();
    if (startupPath){
      setStatus("Открытие " + startupPath + "…");
      await loadPackageFromPath(startupPath);
    }
  } catch (e) { console.warn("pywebview API:", e); }
});

/* =========================================================
   Кнопка "Создать пакет"
   ========================================================= */
document.getElementById("openCreatorBtn").addEventListener("click", async ()=>{
  console.log("[MPZ] Кнопка «Создать пакет» нажата");

  if (window.pywebview && window.pywebview.api && window.pywebview.api.open_creator){
    try {
      setStatus("Открытие конструктора…");
      const res = await window.pywebview.api.open_creator();
      console.log("[MPZ] open_creator:", res);
      if (res && !res.ok){
        setStatus("⚠ " + (res.error || "Не удалось открыть конструктор"));
      } else {
        setStatus("Конструктор открыт");
      }
    } catch(e){
      console.error("[MPZ] Ошибка open_creator:", e);
      setStatus("⚠ Ошибка: " + e.message);
    }
  } else {
    console.warn("[MPZ] pywebview API недоступен, открываю в новой вкладке");
    window.open("creator.html", "_blank");
  }
});
